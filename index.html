<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>우파루파 원정대</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas { display: block; }
#canvas:focus { outline: none; }

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false { display: none; }

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false { image-rendering: pixelated; }

#status-progress, #status-notice { display: none; }

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="quark.icon.png" />
<link rel="apple-touch-icon" href="quark.apple-touch-icon.png"/>
<meta property="og:title" content="우파루파 원정대">
<meta property="og:type" content="website">
<meta property="og:image" content="https://rnntnp.github.io/puzrpg/index.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="우파루파 원정대">
<meta name="twitter:image" content="https://rnntnp.github.io/puzrpg/index.png">
	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>Your browser does not support JavaScript.</noscript>
		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="quark.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>
		<script src="quark.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"quark","experimentalVK":false,"fileSizes":{"quark.pck":98940656,"quark.wasm":1508095},"focusCanvas":true,"gdextensionLibs":["libquarkphysics.web.template_release.wasm32.nothreads.wasm"],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
GODOT_CONFIG.mainPack = 'quark.pck?v=b5a0d1ca335b081715c6359788f8e9d2898628c8aae38c0e4f70499def1a32ad';
GODOT_CONFIG.fileSizes[GODOT_CONFIG.mainPack] = GODOT_CONFIG.fileSizes["quark.pck"];
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function displayFailureNotice(error) {
		console.error(error);
		statusNotice.textContent = error instanceof Error ? error.message : String(error);
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		displayFailureNotice('실행에 필요한 웹 기능을 사용할 수 없습니다: ' + missing.join(', '));
		return;
	}

	setStatusMode('progress');
	engine.startGame({
		onProgress(current, total) {
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
			} else {
				statusProgress.removeAttribute('value');
				statusProgress.removeAttribute('max');
			}
		},
	}).then(() => setStatusMode('hidden'), displayFailureNotice);
}());
		</script>
	</body>
</html>
